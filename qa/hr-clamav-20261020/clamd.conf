# Acceptance only: 1 MiB limit deliberately exercises rejection.
# Socket volume is isolated to temporary test containers; not a deployment config.
Foreground yes
LocalSocket /run/bps-clam/clamd.sock
LocalSocketMode 666
DatabaseDirectory /var/lib/clamav
ScanPDF yes
HeuristicAlerts yes
AlertEncrypted yes
AlertExceedsMax yes
StreamMaxLength 10M
MaxFileSize 1M
MaxScanSize 20M
MaxThreads 1
ConcurrentDatabaseReload no
LogTime yes
